<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="icon" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <title>QR Code Generator</title>
</head>
<body>

    <header class="header">
        <h2>QR Code Generator</h2>
    </header>

    <main class="main">
        <p> Easily generate custom QR codes for websites, phone numbers, emails, Wi-Fi access and GPS locations.
            Just input your data, choose the type of QR code and size, and generate it instantly.
        </p>
        
        <select id="qrType" onchange="updateInputField()">
            <option value="choose" disabled selected>Choose Type</option>
            <option value="url">Website URL </option>
            <option value="phone">Phone Number</option>
            <option value="email">Email Address</option>
            <option value="wifi">Wi-Fi Network</option>
            <option value="gps">GPS Location</option>
        </select>
        
        <input type="text" id="qrInput" placeholder="Enter your Data">

        <select id="imageSize">
            <option value="size" disabled selected>Choose Size</option>
            <option value="200">200x200</option>
            <option value="300">300x300</option>
            <option value="400">400x400</option>
            <option value="500">500x500</option>
        </select>
        
        <button id="GenerateBtn">Generate QR</button>
        
    </main>

    <div id="image">
        <img src="images/qr-code-image.svg" alt="QR image" width="250" height="250">
    </div>

    <footer class="footer">
        <img src="" alt="Generated QR code" id="">
        <button id="DownloadBtn">Download</button>
    </footer>


    <script src="index.js">"main js"</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
